name: test

# Linux job: every push (cheap). macOS job: only when packages or install scripts change,
# or when started by hand — macOS minutes count 10x against a private repo's free quota.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the full macOS install (Brewfile)
        type: boolean
        default: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      install: ${{ steps.diff.outputs.install }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.before }}"
          [ "${{ github.event_name }}" = "pull_request" ] && base="${{ github.event.pull_request.base.sha }}"
          if git cat-file -e "$base" 2>/dev/null && ! git diff --quiet "$base" HEAD -- Brewfile init_script.sh sync.sh tests/ .github/workflows/; then
            echo "install=true" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "$base" 2>/dev/null; then
            echo "install=true" >> "$GITHUB_OUTPUT"   # first push / unknown base
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh jq bc
      # Ubuntu ships group-writable zsh function dirs; compinit then refuses them
      # and tries to prompt. That's a runner quirk, not a config problem.
      - run: zsh -c 'autoload -Uz compaudit; compaudit' | xargs -r sudo chmod g-w,o-w
      - run: bash tests/check-install.sh

  macos:
    needs: changes
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos) ||
      (github.event_name != 'workflow_dispatch' && needs.changes.outputs.install == 'true')
    runs-on: macos-latest   # Apple Silicon (arm64)
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4
      # Runners ship with Homebrew and ~hundreds of packages; move them away so this
      # is a fresh Mac as far as Homebrew is concerned.
      - name: Remove preinstalled Homebrew
        run: sudo mv /opt/homebrew /opt/homebrew-preinstalled
      # Links configs on a home without brew (also checks zsh starts cleanly without it)
      - name: Check configs
        run: bash tests/check-install.sh
      # The real fresh-Mac command: Homebrew, Brewfile, then extras (CLIs, extensions, plugins, skills)
      - name: init_script.sh --all
        id: brew
        continue-on-error: true
        run: NONINTERACTIVE=1 zsh ./init_script.sh --all
      - name: New terminal finds everything
        run: |
          # Minimal env, like a fresh Ghostty window: zshrc alone must set up PATH
          env -i HOME="$HOME" USER="$USER" TERM=xterm-256color PATH=/usr/bin:/bin:/usr/sbin:/sbin \
            zsh -i -c 'for t in brew node npm nvm wt fd fzf gitleaks cxstatusline starship nvim zellij; do
                         whence -w $t >/dev/null && echo "ok      $t" || { echo "MISSING $t"; missing=1; }; done
                       exit ${missing:-0}' 2> "$RUNNER_TEMP/zsh.err"
          rc=$?
          if [ -s "$RUNNER_TEMP/zsh.err" ]; then echo "zsh startup errors:"; cat "$RUNNER_TEMP/zsh.err"; rc=1; fi
          env -i HOME="$HOME" PATH=/opt/homebrew/bin:/usr/bin:/bin python3 -I -c "
          import importlib.util, os, sys
          p = os.path.expanduser('~/.config/cxstatusline/turn-renderer.py')
          s = importlib.util.spec_from_file_location('tr', p); m = importlib.util.module_from_spec(s); s.loader.exec_module(m)
          print('turn-renderer:', m.NODE, m.RENDERER)
          sys.exit(0 if os.path.exists(m.NODE) and os.path.exists(m.RENDERER) else 1)" || rc=1
          exit $rc
      - name: Extras installed
        if: always()
        run: |
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"; rc=0
          check() { if eval "$2" >/dev/null 2>&1; then echo "ok      $1"; else echo "MISSING $1"; rc=1; fi; }
          for e in code cursor; do
            want=$(wc -l < "${e/code/vscode}/extensions.txt" | tr -d ' ')
            have=$(comm -12 <(sort -f "${e/code/vscode}/extensions.txt" | tr A-Z a-z) <($e --list-extensions | tr A-Z a-z | sort) | wc -l | tr -d ' ')
            echo "        $e extensions: $have/$want"; [ "$have" = "$want" ] || rc=1
          done
          check "claude CLI" "command -v claude"
          check "cursor-agent CLI" "command -v cursor-agent"
          for p in $(python3 -c "import json;print(' '.join(k for k,v in json.load(open('claude/settings.json'))['enabledPlugins'].items() if v))"); do
            check "claude plugin $p" "claude plugin list | grep -q '${p%@*}'"
          done
          check "codex wrapper (cxstatusline)" "grep -q turn-renderer ~/.local/bin/codex && ~/.local/bin/codex --version"
          check "skill herdr" "test -f ~/.agents/skills/herdr/SKILL.md"
          check "skill find-skills" "test -f ~/.agents/skills/find-skills/SKILL.md"
          check "skill web-preview (own)" "test -f ~/.claude/skills/web-preview/SKILL.md"
          check "herdr auto-title plugin" "herdr plugin list | grep -q auto-title"
          for x in $(cat azure-cli-extensions.txt); do check "az extension $x" "az extension show --name $x"; done
          exit $rc
      - name: Brew summary
        if: always()
        run: |
          echo "## Brewfile install" >> "$GITHUB_STEP_SUMMARY"
          if brew bundle check --file=Brewfile --verbose > "$RUNNER_TEMP/check.log" 2>&1; then
            echo "Everything in the Brewfile is installed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "$RUNNER_TEMP/check.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fail if Brewfile install failed
        if: steps.brew.outcome == 'failure'
        run: |
          echo "brew bundle failed; see the 'Install Brewfile' step and the summary." && exit 1
